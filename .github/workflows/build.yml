name: Build LibWrt JDCloud RE-SS-01 Meow

on:
  workflow_dispatch:
  push:
    branches: [meow]

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  REPO_URL: https://github.com/LiBwrt/LibWrt
  REPO_BRANCH: 25.12-nss
  TARGET_DIR: qualcommax/ipq60xx
  MEOW_VERSION: 0.29.0

jobs:
  build:
    name: Meow firmware
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build environment
        run: |
          sudo apt-get update
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'

      - name: Clone LibWrt source
        run: |
          git clone -b "$REPO_BRANCH" --depth 1 --single-branch "$REPO_URL" openwrt

      - name: Add VNT2 feed and Meow package
        run: |
          cd openwrt
          echo "src-git vnt2 https://github.com/whzhni1/luci-app-vnt2" >> feeds.conf.default
          grep -Fxq "PKG_VERSION:=$MEOW_VERSION" "$GITHUB_WORKSPACE/package/meow/Makefile" || { echo "::error::Meow package and workflow versions differ"; exit 1; }
          cp -a "$GITHUB_WORKSPACE/package/meow" package/

      - name: Clone luci-theme-liquid directly into package/
        run: |
          git clone --depth 1 https://github.com/zzsj0928/luci-theme-liquid openwrt/package/luci-theme-liquid

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          for feed in nss_packages sqm_scripts_nss packages luci routing telephony video; do
            ./scripts/feeds install -a -p "$feed"
          done
          ./scripts/feeds install -p vnt2 luci-app-vnt2
          test -f package/meow/Makefile || { echo "::error::Native Meow package missing"; exit 1; }

      - name: Patch vnt2 postinst
        run: |
          cd openwrt
          MK=feeds/vnt2/luci-app-vnt2/Makefile
          awk '
            /^define Package\/[^\/]*\/postinst$/ { in_postinst = 1 }
            /^endef$/ { in_postinst = 0 }
            { print }
            in_postinst && /^#!\/bin\/sh/ {
              print "[ -n \"$${IPKG_INSTROOT}\" ] && exit 0"
            }
          ' "$MK" > "$MK.tmp"
          mv "$MK.tmp" "$MK"
          POSTINST=$(sed -n '/^define Package\/[^/]*\/postinst$/,/^endef$/p' "$MK")
          printf '%s\n' "$POSTINST"
          printf '%s\n' "$POSTINST" | grep -Fq '[ -n "$${IPKG_INSTROOT}" ] && exit 0' || { echo "patch not applied to postinst"; exit 1; }

      - name: Apply config and customize
        run: |
          cd openwrt
          cp "$GITHUB_WORKSPACE/.config" .config
          bash "$GITHUB_WORKSPACE/diy.sh"

      - name: Resolve full config
        run: |
          cd openwrt
          make defconfig 2>&1 | tee "$RUNNER_TEMP/meow-defconfig.log"
          if grep -Fq 'recursive dependency detected' "$RUNNER_TEMP/meow-defconfig.log"; then
            echo "::error::Kconfig has recursive package dependencies; see meow-defconfig.log above"
            exit 1
          fi
          for symbol in CONFIG_PACKAGE_meow CONFIG_PACKAGE_luci-app-meow \
            CONFIG_PACKAGE_ddns-go CONFIG_PACKAGE_luci-app-ddns-go CONFIG_PACKAGE_luci-app-vnt2 \
            CONFIG_PACKAGE_ip-full CONFIG_PACKAGE_nftables-json CONFIG_PACKAGE_kmod-tun \
            CONFIG_PACKAGE_kmod-nft-nat CONFIG_PACKAGE_kmod-nft-fib \
            CONFIG_PACKAGE_kmod-nft-socket CONFIG_PACKAGE_kmod-nft-tproxy CONFIG_PACKAGE_luci-theme-liquid; do
            grep -Fxq "$symbol=y" .config || { echo "::error::Required option missing: $symbol"; exit 1; }
          done
          if grep -E '^CONFIG_PACKAGE_(luci-app-run|honk|luci-app-honk|luci-lib-daeuniverse|luci-i18n-daeuniverse-[^=]*|dae|daed[^=]*|luci-app-dae[^=]*|vmlinux-btf(-builtin)?|v2ray-geoip|v2ray-geosite)=[ym]$' .config; then
            echo "::error::Legacy proxy package or resource selected"
            exit 1
          fi
          if grep -E '^(CONFIG_BPF_TOOLCHAIN_HOST|CONFIG_KERNEL_DEBUG_INFO_BTF|CONFIG_KERNEL_CGROUP_BPF|CONFIG_PACKAGE_kmod-nft-queue|CONFIG_PACKAGE_kmod-nfnetlink-queue)=y$' .config; then
            echo "::error::Legacy eBPF/BTF or NFQUEUE configuration selected"
            exit 1
          fi

      - name: Download sources
        run: |
          cd openwrt
          make download -j"$(nproc)"

      - name: Build firmware
        run: |
          cd openwrt
          make -j"$(nproc)" V=s 2>&1 | tee "$RUNNER_TEMP/meow-build.log"

      - name: Upload build diagnostics on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: meow-diagnostics
          path: |
            ${{ runner.temp }}/meow-build.log
            ${{ runner.temp }}/meow-defconfig.log
            openwrt/.config
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Collect firmware
        run: |
          shopt -s nullglob
          MEOW_TARGET_DIR="openwrt/bin/targets/$TARGET_DIR"
          MEOW_IMAGES=("$MEOW_TARGET_DIR"/*-squashfs-factory.bin "$MEOW_TARGET_DIR"/*-squashfs-sysupgrade.bin)
          [ "${#MEOW_IMAGES[@]}" -eq 2 ] || { echo "::error::Expected factory and sysupgrade images for JDCloud RE-SS-01"; exit 1; }
          MEOW_KERNEL_CONFIGS=(openwrt/build_dir/target-*/linux-qualcommax_ipq60xx/linux-*/.config)
          [ "${#MEOW_KERNEL_CONFIGS[@]}" -eq 1 ] || { echo "::error::Kernel configuration missing or ambiguous"; exit 1; }
          for symbol in CONFIG_NFT_SOCKET CONFIG_NFT_TPROXY CONFIG_NFT_REDIR CONFIG_NF_NAT CONFIG_TUN CONFIG_IP_MULTIPLE_TABLES; do
            grep -Eq "^$symbol=(y|m)$" "${MEOW_KERNEL_CONFIGS[0]}" || { echo "::error::Kernel missing Meow support: $symbol"; exit 1; }
          done
          if grep -Fxq 'CONFIG_DEBUG_INFO_BTF=y' "${MEOW_KERNEL_CONFIGS[0]}"; then
            echo "::error::Unneeded kernel BTF remains enabled"
            exit 1
          fi
          MEOW_MANIFESTS=("$MEOW_TARGET_DIR"/*.manifest)
          [ "${#MEOW_MANIFESTS[@]}" -eq 1 ] || { echo "::error::Firmware manifest missing or ambiguous"; exit 1; }
          for package in meow luci-app-meow ddns-go luci-app-ddns-go luci-app-vnt2 ip-full nftables-json kmod-nft-socket kmod-nft-tproxy; do
            grep -Eq "^$package[[:space:]]" "${MEOW_MANIFESTS[0]}" || { echo "::error::Package absent from firmware: $package"; exit 1; }
          done
          if grep -E '^(luci-app-run|honk|luci-app-honk|luci-lib-daeuniverse|luci-i18n-daeuniverse-[^[:space:]]*|dae|daed[^[:space:]]*|luci-app-dae[^[:space:]]*|vmlinux-btf(-builtin)?|v2ray-geoip|v2ray-geosite)[[:space:]]' "${MEOW_MANIFESTS[0]}"; then
            echo "::error::Legacy proxy package or resource in firmware"
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/firmware"
          for file in "${MEOW_IMAGES[@]}" "${MEOW_MANIFESTS[@]}"; do
            cp "$file" "$GITHUB_WORKSPACE/firmware/meow-${file##*/}"
          done
          cp openwrt/.config "$GITHUB_WORKSPACE/firmware/meow-config.buildinfo"
          printf 'Meow: v%s\nLibWrt: %s\n' "$MEOW_VERSION" "$(git -C openwrt rev-parse HEAD)" > "$GITHUB_WORKSPACE/firmware/meow-versions.txt"
          (cd "$GITHUB_WORKSPACE/firmware" && sha256sum *.bin > meow-SHA256SUMS)
          ls -lh "$GITHUB_WORKSPACE/firmware/"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: jdcloud_re-ss-01_meow
          path: firmware/
          if-no-files-found: error

  release:
    name: Publish Meow firmware
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download firmware
        uses: actions/download-artifact@v7
        with:
          name: jdcloud_re-ss-01_meow
          path: firmware/

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: firmware/*
          fail_on_unmatched_files: true
          tag_name: meow-v${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: LibWrt JDCloud RE-SS-01 Meow (build ${{ github.run_number }})
          body: |
            京东云无线宝亚瑟 RE-SS-01 (IPQ6000 · 满血 NSS)
            - **代理**：[meow-rs](https://github.com/meow-rs/meow-rs) `v${{ env.MEOW_VERSION }}`，含官方静态核心和 LuCI 面板。
            - **U-Boot 刷入版本**：`*-squashfs-factory.bin`
            - **在线升级版本**：`*-squashfs-sysupgrade.bin`
            - 默认后台：`192.168.50.1`，用户：`root`，密码：`admin@cd`
            - **面板入口**：LuCI「服务 → meow」，或 `http://192.168.50.1:9090/ui`。
            - Meow 和透明代理默认关闭；添加订阅或节点及路由后，在 LuCI 启用服务和透明代理。
            - **主题**：Liquid；**异地组网**：VNT2；**DDNS**：DDNS-GO。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
